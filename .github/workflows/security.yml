name: Security

# Same three jobs as the org's shared security-scan.yml, inlined so the
# action versions can stay current (checkout v5, upload-sarif v4).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: a secret removed later still leaks

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  forbidden-files:
    name: Forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Block state, tfvars, kubeconfig and key material
        run: |
          bad=$(git ls-files | grep -E \
            '(\.tfvars$|\.tfvars\.json$|terraform\.tfstate|\.tfstate\.backup$|^\.terraform/|kubeconfig|\.kube/config|\.pem$|\.p12$|\.pfx$|id_rsa|\.env$)' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Files that must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No forbidden files present."

      - name: Warn on bare AWS account ids
        run: |
          hits=$(grep -rEn '(^|[^0-9])[0-9]{12}([^0-9]|$)' \
            --include='*.tf' --include='*.tfvars.example' --include='*.yaml' --include='*.yml' \
            . 2>/dev/null | grep -v '\.example:' || true)
          if [ -n "$hits" ]; then
            echo "::warning::Possible AWS account ids - move these to variables:"
            echo "$hits"
          fi

  iac:
    name: IaC misconfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0' # report, do not block, until the baseline is clean

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-iac
