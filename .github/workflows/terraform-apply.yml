# name: Terraform Apply

# # Merge to main -> read the stack folder from the merged commits' messages
# # -> run "terraform apply" in that folder, inside the GitHub environment
# # named after the env folder (dev / uat / prod).
# #
# # Commit message convention (on the branch commits):
# #   [<action>][<stack>] <short description> - Path: /<stack-folder>
# #   e.g. "[update][network] added a private subnet - Path: /resources/us-east-1/dev/network"
# #
# # The newest merged commit that has a "Path:" wins. Works with merge
# # commits, rebase, and squash (for squash, keep GitHub's default squash
# # message "Pull request title and commit details" so the Path survives).
# #
# # Two jobs: "target" reads the Path and works out the env; "apply" runs
# # Terraform inside that GitHub environment, so vars.AWS_ROLE_ARN_APPLY
# # resolves to THAT environment's value (one role per AWS account, same
# # variable name everywhere). Required reviewers on the "prod" environment
# # = a manual approval before every prod apply.
# #
# # Full walkthrough of every block: .github/workflows/README.md

