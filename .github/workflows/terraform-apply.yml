name: Terraform Apply

# Merge to main -> newest merged commit with a "Path:" picks the stack; the
# apply runs in the GitHub environment named after the stack's env folder
# (required reviewers on prod = manual approval before every prod apply).
#
# Squash merges: keep GitHub's default squash message ("Pull request title and
# commit details") so the Path survives into the squashed commit.
#
# Full walkthrough: .github/workflows/README.md

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # AWS auth via OIDC - no stored keys

env:
  AWS_REGION: us-east-1 # must match regional-values.yaml

# Applies never run concurrently.
concurrency:
  group: apply

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.target.outputs.dir }}
      env: ${{ steps.target.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to read the merged commits' messages

      - name: Read stack folder from the merged commits
        id: target
        run: |
          # github.event.before = where main was before this merge
          messages="$(git log --format=%B ${{ github.event.before }}..HEAD)"

          dir="$(echo "$messages" | grep -o 'Path: */[^ ]*' | head -1 | sed 's|Path: */||')"

          if [ ! -d "$dir" ] || [[ "$dir" != resources/* ]]; then
            echo "::error::No merged commit has '- Path: /resources/<region>/<env>/<stack>' (got '$dir')"
            exit 1
          fi

          # resources/us-east-1/dev/network -> dev
          env="$(echo "$dir" | cut -d/ -f3)"

          echo "Terraform will run in: $dir (environment: $env)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "### Terraform will run in \`$dir\` (environment: \`$env\`)" >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env }} # must exist in Settings > Environments; put required reviewers on prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }} # environment variable, not managed in this repo
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2" # >= 1.10 required for S3 native state locking

      - name: Terraform Init (${{ needs.target.outputs.dir }})
        working-directory: ${{ needs.target.outputs.dir }}
        # Same backend config as the plan workflow.
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=${{ github.event.repository.name }}/${{ needs.target.outputs.dir }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply (${{ needs.target.outputs.dir }})
        working-directory: ${{ needs.target.outputs.dir }}
        run: terraform apply -input=false -auto-approve
