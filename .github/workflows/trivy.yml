name: Trivy

# IaC misconfiguration scanning only, standalone. The org's shared
# security-scan.yml (gitleaks + forbidden-files + trivy) can replace this
# later if we want the full set - see infra-aws/.github/workflows/security.yml
# for the caller shape.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  iac:
    name: IaC misconfiguration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0' # report, do not block, until the baseline is clean
        env:
          TRIVY_SKIP_DIRS: '**/.terraform'

      - name: Upload findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-iac
