name: Terraform Plan

# Branch push -> "Path:" in the commit message picks the stack; the plan runs
# in the GitHub environment named after the stack's env folder (dev/uat/prod).
#
# Commit message convention:
#   [<action>][<stack>] <description> - Path: /resources/<region>/<env>/<stack>
#   e.g. "[update][network] add private subnet - Path: /resources/us-east-1/dev/network"
#
# Full walkthrough: .github/workflows/README.md

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  id-token: write # AWS auth via OIDC - no stored keys

env:
  AWS_REGION: us-east-1 # must match regional-values.yaml

# A new push cancels the previous plan for the same branch.
concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.target.outputs.dir }}
      env: ${{ steps.target.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read stack folder from commit message
        id: target
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          dir="$(echo "$COMMIT_MSG" | grep -o 'Path: */[^ ]*' | head -1 | sed 's|Path: */||')"

          if [ ! -d "$dir" ] || [[ "$dir" != resources/* ]]; then
            echo "::error::Commit message must end with '- Path: /resources/<region>/<env>/<stack>' (got '$dir')"
            exit 1
          fi

          # resources/us-east-1/dev/network -> dev
          env="$(echo "$dir" | cut -d/ -f3)"

          echo "Terraform will run in: $dir (environment: $env)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "### Terraform will run in \`$dir\` (environment: \`$env\`)" >> "$GITHUB_STEP_SUMMARY"

  plan:
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env }} # must exist in Settings > Environments
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }} # environment variable, not managed in this repo
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2" # >= 1.10 required for S3 native state locking

      - name: Terraform Format
        run: terraform fmt -check -recursive modules resources

      - name: Terraform Init (${{ needs.target.outputs.dir }})
        working-directory: ${{ needs.target.outputs.dir }}
        # Bucket is not committed (public repo); the state key mirrors the repo
        # layout: <bucket>/<repo-name>/<stack-path>/terraform.tfstate
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=${{ github.event.repository.name }}/${{ needs.target.outputs.dir }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Validate (${{ needs.target.outputs.dir }})
        working-directory: ${{ needs.target.outputs.dir }}
        run: terraform validate

      - name: Terraform Plan (${{ needs.target.outputs.dir }})
        working-directory: ${{ needs.target.outputs.dir }}
        run: terraform plan -input=false
