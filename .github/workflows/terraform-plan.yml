# #
# # Commit message convention:
# #   [<action>][<stack>] <short description> - Path: /<stack-folder>
# #   e.g. "[update][network] added a private subnet - Path: /resources/us-east-1/dev/network"
# #
# # Two jobs: "target" reads the Path and works out the env; "plan" runs
# # Terraform inside that GitHub environment, so vars.AWS_ROLE_ARN_PLAN
# # resolves to THAT environment's value (one role per AWS account, same
# # variable name everywhere). NOTE: required reviewers on an environment
# # gate plans too - keep reviewers on the apply side unless you want to
# # approve every prod plan.
# #
# # Full walkthrough of every block: .github/workflows/README.md

