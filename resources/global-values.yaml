# Naming: <env>-<component>-<region>, e.g. dev-vpc-us-east-1 (README "Naming");
# the org appears as the Org default tag, not in resource names.
org: u25c

# The v2 repo name (becomes the Repo default tag on every resource).
repo: terraform-infra-v2

# Default tags on every resource in every stack; Org, Env, Component and
# Repo are added by each provider. IAM tag keys are case-insensitive, so
# never add a key that differs only by case (env vs Env).
tags:
  ManagedBy: terraform
  Workstream: infra