# Each repository is one file under config/*.yaml (drop the .example suffix
# to activate), merged over repository_defaults below.
#
# CAVEAT: max_image_count counts ALL images, tagged releases included - a
# busy repo can expire images you still deploy. Size it generously or unset
# it per repo and rely on untagged_expiry_days only.
ecr:
  repository_defaults:
    image_tag_mutability: MUTABLE # default: MUTABLE (stage/prod override to IMMUTABLE)
    scan_on_push: true            # default: true
    force_delete: false           # default: false
    untagged_expiry_days: 14      # module default: null (never expire)
    max_image_count: 50           # module default: null (never expire)
