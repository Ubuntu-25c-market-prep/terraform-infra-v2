# One entry per repository under repositories, merged over repository_defaults.
# Repositories are created as <env>-ecr-<region>/<name>. The dev registry
# serves every environment until uat/prod have their own accounts.
ecr:
  name: dev-ecr-us-east-1 # <env>-ecr-<region>: the registry namespace; repositories are <name>/<app>

  repository_defaults:
    image_tag_mutability: MUTABLE   # mutable - dev rebuilds at will
    scan_on_push: true
    force_delete: false           # true lets terraform destroy delete a non-empty repo
    untagged_expiry_days: 14      # module default: null (never expire)
    max_image_count: 50            # module default: null; counts tagged images too - size generously

  repositories:
    # Business apps (apps-business). Both are pushed from that repository's main
    # branch by the dev-ecr-push-us-east-1 role, which is scoped to exactly that
    # repo and ref and to repository/dev-ecr-us-east-1/* - so adding an app here
    # needs no IAM change.
    - name: resume-builder
      image_tag_mutability: IMMUTABLE # promoted to every env from here - a tag must never change meaning
    - name: proshop
      image_tag_mutability: IMMUTABLE # promoted to every env from here - a tag must never change meaning
  #   - name: app # lowercase alphanumeric with . _ / -
  #     image_tag_mutability: IMMUTABLE # any repository_defaults key can be overridden
