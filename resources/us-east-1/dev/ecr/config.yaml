# Each repository is one entry of the repositories array below, merged
# over repository_defaults.
#
# CAVEAT: max_image_count counts ALL images, tagged releases included - a
# busy repo can expire images you still deploy. Size it generously or unset
# it per repo and rely on untagged_expiry_days only.
ecr:
  repository_defaults:
    image_tag_mutability: MUTABLE # default: MUTABLE (stage/prod override to IMMUTABLE)
    scan_on_push: true            # default: true
    force_delete: false           # default: false
    untagged_expiry_days: 14      # module default: null (never expire)
    max_image_count: 50           # module default: null (never expire)

  # One entry per repository; keys not stated fall back to repository_defaults.
  repositories: []
  #
  # Example entry - uncomment and adjust. Only "name" is required.
  # - name: app # REQUIRED: lowercase alphanumeric with . _ / -
  #   # image_tag_mutability: IMMUTABLE   # override the env default if needed
  #   # scan_on_push: true
  #   # force_delete: false               # true lets terraform destroy delete a non-empty repo
  #   # untagged_expiry_days: 14
  #   # max_image_count: 50               # careful: counts tagged images too
