# github role: the business app build on main pushes images. Every env pushes
# to the dev registry until uat/prod accounts exist (ecr/README.md).
name: dev-ecr-push-us-east-1
type: github
github_org: Ubuntu-25c-market-prep@311938159 # org@id - this org issues immutable-id subjects
github_repository: apps-business@1319733881 # repo@id, from `gh api /repos/<org>/<repo> --jq .id`
github_ref: refs/heads/main
policy:
  - actions: [ecr:GetAuthorizationToken]
    resources: ["*"]
  - actions:
      - ecr:BatchCheckLayerAvailability
      - ecr:InitiateLayerUpload
      - ecr:UploadLayerPart
      - ecr:CompleteLayerUpload
      - ecr:PutImage
      - ecr:BatchGetImage
      - ecr:DescribeImages
      - ecr:DescribeRepositories
    resources: ["arn:aws:ecr:us-east-1:808540602855:repository/dev-ecr-us-east-1/*"]
