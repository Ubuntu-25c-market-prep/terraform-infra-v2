# Non-cluster IAM: standalone policies (policies) and roles (roles), each
# merged over role_defaults. Role types: service (AWS principals) or
# irsa (ONE Kubernetes service account). README.md "Keys".
iam:
  oidc_provider_arn: null # eks stack outputs; required only for irsa roles
  oidc_issuer_url: null

  # Customer-managed policies, named <org>-<env>-<name>. Attach by ARN
  # (policy_arns here, attached_policies in eks/iam.yaml) - read the ARN
  # from the policy_arns output after apply.
  policies: []
