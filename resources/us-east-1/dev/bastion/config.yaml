# One small instance in a PUBLIC subnet (no NAT), reached over Session
# Manager - no inbound port. README.md.
bastion:
  name: dev-bastion-us-east-1   # <env>-bastion-<region>: security group and key pair name
  vpc_id: vpc-0849e0f6efc203ff5  # network stack output
  enable_ssm: true              # default: true; instance profile with AmazonSSMManagedInstanceCore
  create_security_group: true   # default: true
  ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjJFFAcxWWZ/n58mdK1xEd7iFO2u7X/qOweZdT3bvfO dev-bastion-us-east-1 # team PUBLIC key; private half in SSM /dev/bastion/ssh-private-key
  key_name: null                # default: null; an existing key pair instead (then ssh_public_key: null)
  ssh_ingress_cidrs: []         # default: []; no inbound rule - SSH goes over SSM

  # Egress: SSH to nodes, HTTPS for SSM and dnf. DNS/NTP are link-local.
  egress_rules:
    - description: SSH to instances inside the VPC
      from_port: 22
      to_port: 22
      protocol: tcp
      cidr_blocks: [10.1.0.0/16] # this environment's VPC CIDR
    - description: HTTPS out (SSM endpoints, dnf updates)
      from_port: 443
      to_port: 443
      protocol: tcp
      cidr_blocks: [0.0.0.0/0]

  instances:
    - name: dev-bastion-us-east-1
      subnet_id: subnet-01fdc5bc4739096a9 # network stack output public-a; must be a PUBLIC subnet
      instance_type: t3.micro   # default: t3.micro
      root_volume_size: 20      # default: 20 GiB
