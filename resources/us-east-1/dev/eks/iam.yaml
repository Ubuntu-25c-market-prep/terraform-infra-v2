# Cluster identity: access_entries (who may call the Kubernetes API),
# service_accounts (IRSA roles), iam_role_tags. README.md "Identity".
# Uncomment a block to activate it; merge BEFORE the release that uses it.

# Keyed by principal: a full ARN is used verbatim; a short name resolves
# via role_name (exact) or role_name_pattern (regex - SSO role names
# carry a random suffix). policy_arn = EKS access policy, or
# kubernetes_groups = cluster RBAC groups.
access_entries:
  platform-admin:
    access_entry_type: STANDARD
    role_name_pattern: AWSReservedSSO_u25c-PlatformAdmin_.*
    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  platform-engineer:
    access_entry_type: STANDARD
    role_name_pattern: AWSReservedSSO_u25c-PlatformEngineer_.*
    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  # arn:aws:iam::<account-id>:user/cicd: # fixed principal, keyed by ARN
  #   access_entry_type: STANDARD
  #   policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
  # arn:aws:iam::<account-id>:role/monitoring-collector: # read-only
  #   access_entry_type: STANDARD
  #   policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy
  # example-team: # RBAC groups, role found by exact name
  #   access_entry_type: STANDARD
  #   role_name: CHANGE_ME-example-team
  #   kubernetes_groups: [example-team-cluster]

# Keyed by the FULL role name (irsa-<org>-<env>-k8s-<workload>, used
# verbatim). namespace_service_account = <namespace>/<service_account>.
# attached_policies: AWS-managed ARNs verbatim; customer-managed ones
# from the iam-roles stack (policies array -> policy_arns output).
service_accounts:
  irsa-u25c-dev-k8s-ebs-csi-controller:
    namespace_service_account: kube-system/ebs-csi-controller-sa
    attached_policies: ["arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"]
  # irsa-u25c-dev-k8s-aws-load-balancer-controller: # binding-only, Terraform owns the LBs
  #   namespace_service_account: kube-system/aws-load-balancer-controller
  #   attached_policies: ["arn:aws:iam::<account-id>:policy/REPLACE-ME-AWSLoadBalancerControllerBindingPolicy"]
  # irsa-u25c-dev-k8s-velero: # needs the s3 stack bucket first
  #   namespace_service_account: velero/velero
  #   attached_policies: ["arn:aws:iam::<account-id>:policy/REPLACE-ME-VeleroPolicy"]
  # irsa-u25c-dev-k8s-external-dns:
  #   namespace_service_account: external-dns/external-dns
  #   attached_policies: ["arn:aws:iam::<account-id>:policy/REPLACE-ME-ExternalDnsPolicy"]
  # irsa-u25c-dev-k8s-cert-manager: # only if DNS01 via Route53
  #   namespace_service_account: cert-manager/cert-manager
  #   attached_policies: ["arn:aws:iam::<account-id>:policy/REPLACE-ME-CertManagerRoute53Policy"]
  # irsa-u25c-dev-k8s-bedrock-invoke:
  #   namespace_service_account: CHANGE_ME-app-namespace/CHANGE_ME-app-sa
  #   attached_policies: ["arn:aws:iam::<account-id>:policy/REPLACE-ME-BedrockInvokePolicy"]

# Karpenter is NOT just an IRSA role (discovery tags, node role, SQS
# queue) - lands as its own change; no discovery tags until then.

iam_role_tags: {} # extra tags on every IRSA role
