# System pool: kube-system / cluster-critical workloads.
# Self-contained file (template node-group format) - every key deploys
# from here. Final EKS name: <env>-<name> = this file's name (dev-ng-system-od-us-east-1).
name: ng-system-od-us-east-1

instance_type_list:
  - t3.medium

min_size: 1
desired_size: 2
max_size: 3
disk_size: 20 # GiB

# k8s_labels: # none for this pool
#   baseservice: system

# k8s_taints: # none for this pool; format is <key>: <value>:<Effect>
#   baseservice: system:NoSchedule

public_instance: true # template key - informational, placement is subnet_ids below

# From the network stack's outputs (private_subnet_ids / public_subnet_ids)
subnet_ids:
  - subnet-01fdc5bc4739096a9 # public-a
  - subnet-0914baf217fb5fd25 # public-b

# tags: # extra per-group tags (Org/Env/... come from provider default_tags)
#   BaseService: system-OnDemand

use_al2023_ami: true
use_on_demand_instance: true
