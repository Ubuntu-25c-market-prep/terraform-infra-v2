# Base spot pool: STATELESS, interruption-tolerant workloads only - spot
# is a cost lever, not a home for anything stateful.
# Self-contained file (template node-group format) - every key deploys
# from here. Final EKS name: <org>-<env>-<name> (u25c-dev-ng-base-spot-us-east-1).
name: ng-base-spot-us-east-1

instance_type_list: # >1 type: better spot availability
  - t3.medium
  - t3a.medium

min_size: 0 # can scale to zero
desired_size: 1
max_size: 4
disk_size: 20 # GiB

k8s_labels:
  capacity: spot # so workloads can opt in/out of interruptible nodes

# k8s_taints: # none for this pool; format is <key>: <value>:<Effect>
#   capacity: spot:NoSchedule

public_instance: false # template key - informational, placement is subnet_ids below

# From the network stack's outputs (private_subnet_ids / public_subnet_ids)
subnet_ids:
  - subnet-REPLACE-ME-private-a
  - subnet-REPLACE-ME-private-b

# tags: # extra per-group tags (Org/Env/... come from provider default_tags)
#   BaseService: base-spot

use_al2023_ami: true
use_on_demand_instance: false # SPOT
