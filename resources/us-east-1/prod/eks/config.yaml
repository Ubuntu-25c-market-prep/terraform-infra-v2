# Flat cluster/infra keys up top, cluster behaviour under eks:. Node
# groups: ng/*.yaml, extra security groups: sg/*.yaml, identity: iam.yaml.
# Key meanings: README.md "Keys".
cluster_name: u25c-prod-cluster # immutable - a change recreates the cluster
cluster_version: "1.34"        # default: null (AWS picks)

# network stack outputs (private subnets: AWS recommendation for the control-plane ENIs)
vpc_id: vpc-REPLACE-ME
cluster_subnet_ids:
  - subnet-REPLACE-ME-private-a
  - subnet-REPLACE-ME-private-b

# SSH to nodes via the bastion only; both null = no SSH. Creation-only.
ssh_key_name: u25c-prod-bastion             # bastion stack output key_pair_name
node_jump_server_ssh: 10.1.0.REPLACE-ME/32 # bastion private IP /32 (bastion output private_ips)

kms_key_id: arn:aws:kms:us-east-1:REPLACE-ME:key/REPLACE-ME # default: null; KMS key ARN for Secrets envelope encryption

# tags: # extra stack tags (Org/Env/Component/Repo come from default_tags)
#   Project:

eks:
  create_oidc: true                  # IRSA needs it (iam-roles stack, iam.yaml service_accounts)
  service_ipv4_cidr: 172.20.0.0/16   # default: null (AWS picks); must not overlap the VPC
  public_access_cidrs:               # default: [0.0.0.0/0]; narrow in CI, not by committing office IPs
    - 10.1.0.0/16
  endpoint_public_access: true       # default: true
  endpoint_private_access: true      # default: false; in-VPC callers need no internet path
  enabled_log_types: [api, audit, authenticator]  # default: [] (api, audit, authenticator, controllerManager, scheduler)
  authentication_mode: API           # default: API (access entries; aws-auth ConfigMap is deprecated)
  bootstrap_cluster_creator_admin_permissions: true # default: true (the CI apply role keeps admin)

  # Extra ingress to the CONTROL PLANE ENIs (becomes one extra SG); {} = none
  cluster_ingress_rules: {}
  # cluster_ingress_rules:
  #   allow_443_from_internal:
  #     cidrs: [10.1.0.0/16] # this environment's VPC CIDR
  #     from_port: 443
  #     to_port: 443
  #     ip_protocol: tcp

  # Extra ingress on the EKS-managed cluster SG (every node); {} = none
  shared_node_ingress_rules: {}
  # shared_node_ingress_rules:
  #   allow_all_internal:
  #     cidrs: [10.1.0.0/16]
  #     ip_protocol: -1 # all traffic - omit the ports
  #   allow_hsm_client:
  #     referenced_security_group_ids: [sg-CHANGE_ME]
  #     from_port: 2223
  #     to_port: 2225
  #     ip_protocol: tcp

  # Node-pool roles created OUTSIDE this stack (e.g. Karpenter) -> EC2_LINUX access entries
  additional_node_pools_iam_roles: []
  # additional_node_pools_iam_roles:
  #   - CHANGE_ME-karpenter-node
