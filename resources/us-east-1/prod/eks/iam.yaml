# Cluster identity: access_entries (who may call the Kubernetes API),
# service_accounts (IRSA roles), iam_role_tags. README.md "Identity".
# Uncomment a block to activate it; merge BEFORE the release that uses it.

# Keyed by principal: a full ARN is used verbatim; a short name resolves
# via role_name (exact) or role_name_pattern (regex - SSO role names
# carry a random suffix). policy_arn = EKS access policy, or
# kubernetes_groups = cluster RBAC groups.
access_entries:
  platform-admin:
    access_entry_type: STANDARD
    role_name_pattern: AWSReservedSSO_u25c-PlatformAdmin_.*
    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  platform-engineer:
    access_entry_type: STANDARD
    role_name_pattern: AWSReservedSSO_u25c-PlatformEngineer_.*
    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  # arn:aws:iam::<account-id>:user/cicd: # fixed principal, keyed by ARN
  #   access_entry_type: STANDARD
  #   policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
  # arn:aws:iam::<account-id>:role/monitoring-collector: # read-only
  #   access_entry_type: STANDARD
  #   policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy
  # example-team: # RBAC groups, role found by exact name
  #   access_entry_type: STANDARD
  #   role_name: CHANGE_ME-example-team
  #   kubernetes_groups: [example-team-cluster]

# Keyed by the FULL role name (<env>-irsa-<workload>-<region>, used
# verbatim; the region is in the name because an IRSA role is bound to
# this cluster's OIDC provider). namespace_service_account = <namespace>/<service_account>.
# attached_policies: AWS-managed ARNs verbatim; customer-managed ones
# from the iam-roles stack (policies array -> policy_arns output).
service_accounts: {}
