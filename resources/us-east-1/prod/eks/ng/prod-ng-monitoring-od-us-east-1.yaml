# Dedicated monitoring pool: Prometheus/Grafana - Prometheus memory grows
# with the metric count. Tainted so only workloads tolerating
# dedicated=monitoring land here (set the toleration in the Flux-managed
# kube-prometheus-stack release).
# Self-contained file (template node-group format) - every key deploys
# from here. Final EKS name: <org>-<env>-<name> (u25c-prod-ng-monitoring-od-us-east-1).
name: ng-monitoring-od-us-east-1

instance_type_list:
  - m5.large

min_size: 2
desired_size: 3
max_size: 5
disk_size: 20 # GiB

k8s_labels:
  workload: monitoring

k8s_taints: # format is <key>: <value>:<Effect>
  dedicated: monitoring:NoSchedule

public_instance: false # template key - informational, placement is subnet_ids below

# From the network stack's outputs (private_subnet_ids / public_subnet_ids)
subnet_ids:
  - subnet-REPLACE-ME-private-a
  - subnet-REPLACE-ME-private-b

# tags: # extra per-group tags (Org/Env/... come from provider default_tags)
#   BaseService: monitoring-OnDemand

use_al2023_ami: true
use_on_demand_instance: true
