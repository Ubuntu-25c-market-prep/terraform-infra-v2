# Two public + two private subnets, no NAT (see README.md "Design").
name: prod-vpc-us-east-1 # <env>-vpc-<region>; prefixes every network resource name
cidr_prefix: "10.3" # quoted - a bare number is YAML for a float
cidr_suffix: 0.0/16
instance_tenancy: default                   # default: default
enable_dns_hostnames: true                  # default: true
enable_dns_support: true                    # default: true
enable_network_address_usage_metrics: false # default: false
map_public_ip_on_launch: true               # default: true (not in the template)

# Free gateway endpoints (not in the template), on every table with enable_endpoint_route: true
gateway_endpoints: [s3, dynamodb]

# karpenter.sh/discovery is public-only on purpose: nodes live in public
# subnets (no NAT), a private-subnet node would have no egress.
public_subnet_tags:
  kubernetes.io/role/elb: "1"
  karpenter.sh/discovery: prod-eks-us-east-1
private_subnet_tags:
  kubernetes.io/role/internal-elb: "1"

# Public /20s on purpose: nodes and CNI /28 pod prefixes share them;
# /24s fragment and starve new nodes of prefixes (gitops-flux#142).
subnets:
  public-a:
    availability_zone: us-east-1a
    cidr_suffix: 0.0/20
  public-b:
    availability_zone: us-east-1b
    cidr_suffix: 16.0/20
  private-a:
    availability_zone: us-east-1a
    cidr_suffix: 32.0/24
  private-b:
    availability_zone: us-east-1b
    cidr_suffix: 33.0/24

# enable_igw: true = PUBLIC. Keys become the Name tags. One private table:
# without NAT, per-AZ tables would be identical.
route_tables:
  prod-route-us-east-1-public:
    enable_igw: true
    enable_endpoint_route: true
    attach_to_subnets:
      - public-a
      - public-b
  prod-route-us-east-1-private:
    enable_igw: false
    # nat_gateway: public-a # template key, not wired (no NAT in the vpc module)
    enable_endpoint_route: true
    attach_to_subnets:
      - private-a
      - private-b

