# Two public + two private subnets, no NAT (see README.md "Design").
name: u25c-prod-vpc
cidr_prefix: "10.1" # quoted - a bare number is YAML for a float
cidr_suffix: 0.0/16
instance_tenancy: default                   # default: default
enable_dns_hostnames: true                  # default: true
enable_dns_support: true                    # default: true
enable_network_address_usage_metrics: false # default: false
map_public_ip_on_launch: true               # default: true (not in the template)

public_subnet_tags: {}  # default: {}; no kubernetes.io/role/* discovery tags until go-live (README)
private_subnet_tags: {} # default: {}

subnets:
  public-a:
    availability_zone: us-east-1a
    cidr_suffix: 0.0/24
  public-b:
    availability_zone: us-east-1b
    cidr_suffix: 1.0/24
  private-a:
    availability_zone: us-east-1a
    cidr_suffix: 2.0/24
  private-b:
    availability_zone: us-east-1b
    cidr_suffix: 3.0/24

# Route tables drive the subnets: enable_igw: true = PUBLIC. Keys become
# the route table Name tags. (enable_peering_route, vpc_endpoint,
# custom_route, attach_to_igw: template keys, not wired.)
route_tables:
  prod-route-us-east-1-public:
    enable_igw: true
    enable_endpoint_route: true
    attach_to_subnets:
      - public-a
      - public-b
  prod-route-us-east-1a-private:
    enable_igw: false
    # nat_gateway: public-a # no NAT - uncomment (and below) to restore private egress
    enable_endpoint_route: true
    attach_to_subnets:
      - private-a
  prod-route-us-east-1b-private:
    enable_igw: false
    # nat_gateway: public-b
    enable_endpoint_route: true
    attach_to_subnets:
      - private-b

