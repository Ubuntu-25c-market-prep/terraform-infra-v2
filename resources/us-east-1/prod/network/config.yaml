# Two public + two private subnets, no NAT (see README.md "Design").
name: prod-vpc-us-east-1 # <env>-vpc-<region>; prefixes every network resource name
cidr_prefix: "10.3" # quoted - a bare number is YAML for a float
cidr_suffix: 0.0/16
instance_tenancy: default                   # default: default
enable_dns_hostnames: true                  # default: true
enable_dns_support: true                    # default: true
enable_network_address_usage_metrics: false # default: false
map_public_ip_on_launch: true               # default: true (not in the template)

public_subnet_tags: {}  # default: {}; no kubernetes.io/role/* discovery tags until go-live (README)
private_subnet_tags: {} # default: {}

# Public /20s on purpose: nodes and CNI /28 pod prefixes share them;
# /24s fragment and starve new nodes of prefixes (gitops-flux#142).
subnets:
  public-a:
    availability_zone: us-east-1a
    cidr_suffix: 0.0/20
  public-b:
    availability_zone: us-east-1b
    cidr_suffix: 16.0/20
  private-a:
    availability_zone: us-east-1a
    cidr_suffix: 32.0/24
  private-b:
    availability_zone: us-east-1b
    cidr_suffix: 33.0/24

# Route tables drive the subnets: enable_igw: true = PUBLIC. Keys become
# the route table Name tags. One private table for both private subnets:
# with no NAT gateway a private table holds no default route, so per-AZ
# tables would be identical. (enable_peering_route, vpc_endpoint,
# custom_route, attach_to_igw: template keys, not wired.)
route_tables:
  prod-route-us-east-1-public:
    enable_igw: true
    enable_endpoint_route: true
    attach_to_subnets:
      - public-a
      - public-b
  prod-route-us-east-1-private:
    enable_igw: false
    # nat_gateway: public-a # no NAT - uncomment for private egress via one NAT
    #                       # (per-AZ NATs need one table per AZ again)
    enable_endpoint_route: true
    attach_to_subnets:
      - private-a
      - private-b

