  #           - s3:ListMultipartUploadParts
  #         resources: ["arn:aws:s3:::prod-s3-us-east-1-velero-<account-id>/*"]
  #       - actions:
  #           - s3:ListBucket
  #         resources: ["arn:aws:s3:::prod-s3-us-east-1-velero-<account-id>"]
  #   - name: prod-ExternalDnsPolicy-us-east-1
  #     statements:
  #       - actions:
  #           - route53:ChangeResourceRecordSets
  #         resources: ["arn:aws:route53:::hostedzone/*"] # narrow to your zone id
  #       - actions:
  #           - route53:ListHostedZones
  #           - route53:ListResourceRecordSets
  #           - route53:ListTagsForResource
  #         resources: ["*"]
  #   - name: prod-CertManagerRoute53Policy-us-east-1
