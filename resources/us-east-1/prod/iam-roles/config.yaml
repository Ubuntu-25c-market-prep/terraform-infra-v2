# Non-cluster IAM: standalone policies (policies) and roles (roles), each
# merged over role_defaults. Role types: service (AWS principals) or
# irsa (ONE Kubernetes service account). README.md "Keys".
iam:
  oidc_provider_arn: null # eks stack outputs; required only for irsa roles
  oidc_issuer_url: null

  # Customer-managed policies; `name` is the FULL name (<env>-<Name>-<region>,
  # e.g. dev-AWSLoadBalancerControllerBindingPolicy-us-east-1). Attach by ARN
  # (policy_arns here, attached_policies in eks/iam.yaml) - read the ARN
  # from the policy_arns output after apply.
  policies:
    - name: prod-AWSLoadBalancerControllerBindingPolicy-us-east-1 # binding-only: Terraform owns the LBs (alb/nlb stacks)
      description: TargetGroupBinding only - describe + register/deregister targets
      statements:
        - actions:
            - elasticloadbalancing:DescribeTargetGroups
            - elasticloadbalancing:DescribeTargetGroupAttributes
            - elasticloadbalancing:DescribeTargetHealth
            - elasticloadbalancing:DescribeLoadBalancers
            - elasticloadbalancing:DescribeListeners
            - elasticloadbalancing:DescribeRules
            - elasticloadbalancing:DescribeTags
            - ec2:DescribeInstances
            - ec2:DescribeSubnets
            - ec2:DescribeSecurityGroups
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeVpcs
            - ec2:DescribeAvailabilityZones
          resources: ["*"]
        - actions:
            - elasticloadbalancing:RegisterTargets
            - elasticloadbalancing:DeregisterTargets
          resources: ["*"] # or the target group ARNs from the alb/nlb outputs
  #   - name: prod-VeleroPolicy-us-east-1
