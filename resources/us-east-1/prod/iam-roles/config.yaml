  #       - actions:
  #           - ec2:DescribeVolumes
  #           - ec2:DescribeSnapshots
  #           - ec2:CreateTags
  #           - ec2:CreateVolume
  #           - ec2:CreateSnapshot
  #           - ec2:DeleteSnapshot
  #         resources: ["*"]
