# One small instance in a PUBLIC subnet: SSH entry point into the VPC
# (no NAT, so a private instance would have no route out). README.md.
bastion:
  vpc_id: vpc-REPLACE-ME        # network stack output
  create_security_group: true   # default: true
  ssh_public_key: CHANGE_ME     # default: null; the team's PUBLIC key - Terraform creates the key pair
  key_name: null                # default: null; an existing key pair instead (then ssh_public_key: null)
  ssh_ingress_cidrs: [0.0.0.0/0] # default: []; narrow at plan time in CI

  # Egress is deliberately narrow; DNS/NTP need no rules (link-local).
  egress_rules:
    - description: SSH to instances inside the VPC
      from_port: 22
      to_port: 22
      protocol: tcp
      cidr_blocks: [10.2.0.0/16] # this environment's VPC CIDR
    - description: HTTPS out (dnf updates - AL2023 repos are HTTPS-only)
      from_port: 443
      to_port: 443
      protocol: tcp
      cidr_blocks: [0.0.0.0/0]

  instances:
    - name: bastion
      subnet_id: subnet-REPLACE-ME-public-a # network stack output; must be a PUBLIC subnet
      instance_type: t3.micro   # default: t3.micro
      root_volume_size: 20      # default: 20 GiB
