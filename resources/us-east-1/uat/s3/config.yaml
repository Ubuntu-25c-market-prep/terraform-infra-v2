# One entry per bucket under buckets, merged over bucket_defaults.
# Bucket names come out as <org>-<env>-<name>-<account-id>.
s3:
  bucket_defaults:
    versioning: true
    force_destroy: false  # true lets terraform destroy a NON-EMPTY bucket
    lifecycle_rules: []   # [{id, prefix?, expiration_days?, noncurrent_expiration_days?}]

  buckets: []
