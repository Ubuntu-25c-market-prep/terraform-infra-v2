# Dedicated ELK pool: tainted so only workloads that tolerate
# dedicated=elk land here (set the toleration in the Flux-managed ELK
# release). Raise to r-family if Elasticsearch heap pressure shows up.
# Self-contained file (template node-group format) - every key deploys
# from here. Final EKS name: <org>-<env>-<name> (u25c-uat-ng-elk-od-us-east-1).
name: ng-elk-od-us-east-1

instance_type_list:
  - t3.large

min_size: 1
desired_size: 2
max_size: 4
disk_size: 20 # GiB

k8s_labels:
  workload: elk

k8s_taints: # format is <key>: <value>:<Effect>
  dedicated: elk:NoSchedule

public_instance: false # template key - informational, placement is subnet_ids below

# From the network stack's outputs (private_subnet_ids / public_subnet_ids)
subnet_ids:
  - subnet-REPLACE-ME-private-a
  - subnet-REPLACE-ME-private-b

# tags: # extra per-group tags (Org/Env/... come from provider default_tags)
#   BaseService: elk-OnDemand

use_al2023_ami: true
use_on_demand_instance: true
