# Cluster identity (org iam.yaml format), next to config.yaml:
#   access_entries   - who may call the Kubernetes API, keyed by principal
#   service_accounts - IRSA roles workloads assume, keyed by role name
#   iam_role_tags    - extra tags on every IRSA role
# CI identity (GitHub Actions plan/apply roles) is NOT managed in this
# repo - the workflows only reference it via Actions variables.
# Non-cluster IAM stays in the iam stack.

# Keys are the principal. The org template keys by full ARN - an arn: key
# works here verbatim - but ARNs embed the account id and this repo is
# PUBLIC, so our entries key by a short name and resolve the principal at
# plan time via role_name_pattern (SSO roles) or role_name instead.
# EKS auto-creates entries for this stack's managed node groups: never
# list those. Node-pool roles from OTHER stacks: prefer
# eks.additional_node_pools_iam_roles in config.yaml (EC2_LINUX shorthand).
# NOTE: the pattern lookup needs iam:ListRoles on the SSO path - plan via
# CI or as PlatformAdmin, not locally as PlatformEngineer.
access_entries:
  platform-admin:
    access_entry_type: STANDARD
    role_name_pattern: AWSReservedSSO_u25c-PlatformAdmin_.*
    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  platform-engineer:
    access_entry_type: STANDARD
    role_name_pattern: AWSReservedSSO_u25c-PlatformEngineer_.*
    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  # kubernetes_groups bind the principal to cluster RBAC groups instead
  # of (or besides) an EKS access policy:
  #  example-team:
  #    access_entry_type: STANDARD
  #    role_name: CHANGE_ME-example-team
  #    kubernetes_groups:
  #      - example-team-cluster

  # A full-ARN key, org-template style (private forks only - ARNs embed
  # the account id and never belong in this public repo):
  #  arn:aws:iam::<account>:user/cicd:
  #    access_entry_type: STANDARD
  #    policy_arn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

# IRSA: keyed by role name; the iam module prefixes <org>-<env>-, so
# "ebs-csi" becomes u25c-uat-ebs-csi - read the exact name from the stack
# output irsa_role_names and put it in the service account's
# eks.amazonaws.com/role-arn annotation.
# namespace_service_account is <namespace>/<service_account>; the role is
# assumable ONLY by that service account (org rule, Kyverno-enforced).
# Permissions: attached_policies (managed policy ARNs) and/or policy
# (inline statements). No roles yet - tool teams: uncomment YOUR block
# below (or add one like it) and open a PR against this stack; merge the
# role BEFORE the Flux/Argo release that uses it.
service_accounts: {}

