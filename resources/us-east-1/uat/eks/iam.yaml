# Karpenter (Scaling team) is NOT just an IRSA role. The
# karpenter.sh/discovery tags are deliberately NOT applied yet (another
# cluster's Karpenter runs in this account - no discovery tags until
# this infra is ready); those tags, the controller IRSA role, node
# role/instance profile and SQS interruption queue land as their own
# infra change when the team migrates.

# Extra tags on every IRSA role (Org/Env/Component/Repo and the layered
# ManagedBy/Workstream tags come from the provider's default_tags already).
iam_role_tags: {}
