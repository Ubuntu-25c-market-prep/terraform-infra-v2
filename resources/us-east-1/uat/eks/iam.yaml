# --- AWS Load Balancer Controller, binding-only (lb stack) -------------
# Terraform owns the ALB, listeners and target groups (../lb); the
# controller's only job is registering pod IPs via TargetGroupBinding.
# So the policy is register/deregister + describe - a fraction of the
# upstream iam_policy.json, which is only needed when the controller may
# CREATE load balancers. Activate together with the Flux release of the
# controller, BEFORE the first TargetGroupBinding ships.
#   aws-lb-controller:
#     namespace_service_account: kube-system/aws-load-balancer-controller
#     description: registers pod IPs into Terraform-owned target groups (TargetGroupBinding)
#     policy:
#       - effect: Allow
#         actions:
#           - elasticloadbalancing:DescribeTargetGroups
#           - elasticloadbalancing:DescribeTargetGroupAttributes
#           - elasticloadbalancing:DescribeTargetHealth
#           - elasticloadbalancing:DescribeLoadBalancers
#           - elasticloadbalancing:DescribeListeners
#           - elasticloadbalancing:DescribeRules
#           - elasticloadbalancing:DescribeTags
#           - ec2:DescribeInstances
#           - ec2:DescribeSubnets
#           - ec2:DescribeSecurityGroups
#           - ec2:DescribeNetworkInterfaces
#           - ec2:DescribeVpcs
#           - ec2:DescribeAvailabilityZones
#         resources: ["*"] # describe calls do not support resource-level ARNs
#       - effect: Allow
#         actions: [elasticloadbalancing:RegisterTargets, elasticloadbalancing:DeregisterTargets]
#         resources: ["*"] # target group ARNs embed the account id - keep them out of this public file

