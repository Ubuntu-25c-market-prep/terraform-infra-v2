# Terraform OWNS this load balancer - the NLB, listeners, target groups
# and security groups are IaC, and deleting a Kubernetes object can never
# delete them. The AWS Load Balancer Controller's only job here is
# registering pod IPs into the target groups via TargetGroupBinding (see
# README.md). That split keeps the LB's DNS name stable across cluster
# rebuilds and is what later allows blue-green across clusters.
# Every wired value is stated here on purpose (strict lookups in main.tf).
# The "# default:" comments show what the nlb module would use if the value
# were optional - kept for reference, but THIS file is what deploys.
nlb:
  name: nlb
  internal: false                 # default: false (true = private subnets, no public IPs)
  ingress_cidrs: [0.0.0.0/0]      # default: [0.0.0.0/0]; narrow for internal/admin NLBs
  ip_address_type: ipv4           # default: ipv4 (or dualstack)
  cross_zone_load_balancing: true # default: true (off = each AZ only sees its own AZ's pods)

  # uat is rebuilt at will; MUST be true in prod - the NLB's DNS name is
  # an external contract and a delete severs every record pointing at it.
  deletion_protection: false # default: false

  # ACM certificate looked up by domain at plan time - an ALIAS-style
  # lookup, never an ARN, because this file is public (ARNs embed the
  # account id). Only needed when a tg/ file declares a TLS listener;
  # null = plain TCP/UDP listeners only (TLS then terminates in the pod,
  # e.g. at an Istio ingress gateway).
  certificate_domain: null # default: null (e.g. "*.uat.example.com")

  ssl_policy: ELBSecurityPolicy-TLS13-1-2-2021-06 # default: same (unused while certificate_domain is null)

# target_group_defaults apply to every target group under tg/*.yaml unless
# the group's own file overrides them. NOTE: the merge is shallow - a tg
# file that sets health_check replaces the WHOLE map, so restate every
# health_check key you keep. No files in tg/ = an NLB with no listeners
# (the skeleton applies cleanly before any app exists).
target_groups:
  target_group_defaults:
    protocol: TCP              # default: TCP (or UDP / TCP_UDP; TLS is a listener protocol, not a target one)
    deregistration_delay: 30   # default: 30 (seconds of connection draining)
    preserve_client_ip: true   # default: true (pods see the real client IP; SG rules still reference the NLB SG)
    proxy_protocol_v2: false   # default: false (enable only if the pod-side proxy parses PROXY v2 headers)
    health_check:
      protocol: TCP            # default: TCP (or HTTP / HTTPS - then path and matcher apply)
      port: traffic-port       # default: traffic-port (or a port number as a string)
      path: /                  # default: / (ignored for TCP)
      matcher: "200-399"       # default: "200-399" (ignored for TCP)
      interval: 10             # default: 10 (seconds)
      timeout: 5               # default: 5 (seconds, must be < interval)
      healthy_threshold: 2     # default: 2
      unhealthy_threshold: 2   # default: 2
